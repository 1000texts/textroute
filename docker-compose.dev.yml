# Development stack. Every service publishes its own port and is reached
# directly; there is no reverse proxy here. See docker-compose.prod.yml for the
# production topology, where nginx is the only public entry point.

services:
  # ----------------------------
  # TextRoute FastAPI application
  # --reload + debugpy
  # TextRoute: 6060 exposed
  # debugpy: 5678 exposed
  # ----------------------------
  textroute:
    build:
      context: ./textroute-api
      dockerfile: Dockerfile
    command:
      [
        "python",
        "-m",
        "debugpy",
        "--listen",
        "0.0.0.0:5678",
        "-m",
        "uvicorn",
        "src.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "6060",
        "--reload"
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-${DATABASE_URL}}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_CHALLENGE_TTL_SECONDS: ${AUTH_CHALLENGE_TTL_SECONDS:-600}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
      AUTH_MAX_ATTEMPTS: ${AUTH_MAX_ATTEMPTS:-5}
      AUTH_EXPOSE_DEVELOPMENT_CODE: ${AUTH_EXPOSE_DEVELOPMENT_CODE:-true}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-textroute_session}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
      SQL_ECHO: ${SQL_ECHO:-true}
      MODERATOR_WEB_ORIGIN: ${MODERATOR_WEB_ORIGIN:-http://localhost:5174}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL_PATH: ${LLM_MODEL_PATH}
      LLM_EMBEDDING_MODEL_GGUF: ${LLM_EMBEDDING_MODEL_GGUF}
      SMS_PROVIDER: ${SMS_PROVIDER:-logging}
      SMS_PROVIDER_URL: ${SMS_PROVIDER_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6060:6060"
      - "5678:5678"
    volumes:
      - ./textroute-api:/app
      - ${LLM_MODELS_HOST_PATH}:/app/models
    networks:
      - web
      - internal
    restart: unless-stopped

  # ----------------------------
  # MkDocs documentation
  # 8000 exposed
  # URL: optional/local
  # ----------------------------
  mkdocs:
    build:
      context: ./docs/mkdocs
      target: dev
    ports:
      - "8000:8000"
    networks:
      - web
    restart: unless-stopped

  # ----------------------------
  # SMS simulator
  # Development/testing only
  # ----------------------------
  sms-simulator:
    build:
      context: ./tools/sms-simulator
      target: dev
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:6060}
        VITE_WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:6060}
      VITE_WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
    ports:
      - "5173:5173"
    volumes:
      # Bind-mount source for HMR; keep the image's Linux-built node_modules.
      - ./tools/sms-simulator:/app
      - sms_simulator_node_modules:/app/node_modules
    networks:
      - web
    restart: unless-stopped

  # ----------------------------
  # Moderator web UI
  # Opt-in: docker compose --profile ui up
  # Origin must match MODERATOR_WEB_ORIGIN (API CORS + session cookie)
  # 5174 exposed
  # ----------------------------
  moderator-web:
    profiles: ["ui"]
    build:
      context: ./moderator-web
      target: dev
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:6060}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:6060}
    ports:
      - "5174:5174"
    volumes:
      - ./moderator-web:/app
      - moderator_web_node_modules:/app/node_modules
    networks:
      - web
    restart: unless-stopped

  # ----------------------------
  # PostgreSQL + pgvector
  # 5432 exposed for local tools
  # ----------------------------
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  moderator_web_node_modules:
  sms_simulator_node_modules:

networks:
  web:
  internal:
