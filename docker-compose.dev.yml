services:
  # ----------------------------
  # Nginx reverse proxy
  # Docker network
  # ----------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - web
    restart: unless-stopped

  # ----------------------------
  # TextRoute FastAPI application
  # --reload + debugpy
  # TextRoute: 6060 exposed
  # debugpy: 5678 exposed
  # ----------------------------
  textroute:
    build:
      context: ./textroute-api
      dockerfile: Dockerfile
    command:
      [
        "python",
        "-m",
        "debugpy",
        "--listen",
        "0.0.0.0:5678",
        "-m",
        "uvicorn",
        "src.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "6060",
        "--reload"
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL_PATH: ${LLM_MODEL_PATH}
      LLM_EMBEDDING_MODEL_GGUF: ${LLM_EMBEDDING_MODEL_GGUF}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6060:6060"
      - "5678:5678"
    volumes:
      - ./textroute-api:/app
      - ${LLM_MODELS_HOST_PATH}:/app/models
    networks:
      - web
      - internal
    restart: unless-stopped

  # ----------------------------
  # MkDocs documentation
  # 8000 exposed
  # URL: optional/local
  # ----------------------------
  mkdocs:
    build:
      context: ./docs/mkdocs
    ports:
      - "8000:8000"
    networks:
      - web
    restart: unless-stopped

  # ----------------------------
  # SMS simulator
  # Development/testing only
  # ----------------------------
  sms-simulator:
    build:
      context: ./tools/sms-simulator
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:6060}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:6060}
    ports:
      - "5173:5173"
    networks:
      - web
    restart: unless-stopped

  # ----------------------------
  # PostgreSQL + pgvector
  # 5432 exposed for local tools
  # ----------------------------
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  web:
  internal:
