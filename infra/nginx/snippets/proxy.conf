# Standard headers for proxying to an upstream container.
#
# Deliberately sets no timeouts. nginx rejects a duplicate proxy_read_timeout
# outright rather than letting the later value win, so a vhost including this
# snippet could not raise them; leaving them out lets each vhost choose, and
# nginx's own 60s defaults apply otherwise.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
