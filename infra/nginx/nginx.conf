# Base nginx config for the TextRoute edge proxy.
#
# Differs from the stock file in one way: it also includes local.d, a
# gitignored directory for vhosts specific to one server (for example another
# application already running on the same box). That keeps host-specific
# configuration out of this public repository.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml image/svg+xml;

    server_tokens off;

    # Rendered from /etc/nginx/templates/*.conf.template at container start.
    include /etc/nginx/conf.d/*.conf;

    # Server-specific vhosts, not tracked in this repository.
    include /etc/nginx/local.d/*.conf;
}
