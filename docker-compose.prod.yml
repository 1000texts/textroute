services:
  # ----------------------------
  # Nginx reverse proxy
  # Public entry point
  # ----------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - textroute
      - mkdocs
    networks:
      - web
    restart: unless-stopped

  # ----------------------------
  # TextRoute FastAPI application
  # ----------------------------
  textroute:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      [
        "uvicorn",
        "src.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "6060"
      ]
    environment:
      DATABASE_URL: "postgresql://postgres:mypassword%28%29@postgres:5432/postgres"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
      - internal
    restart: unless-stopped

  # ----------------------------
  # MkDocs documentation
  # Public through Nginx:
  # https://textroute-docs.1000texts.com
  # ----------------------------
  mkdocs:
    build:
      context: ./docs/mkdocs
    networks:
      - web
    restart: unless-stopped

  # ----------------------------
  # PostgreSQL + pgvector
  # ----------------------------
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "mypassword%28%29"
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  web:
  internal:
    internal: true