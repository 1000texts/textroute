services:
  # ----------------------------
  # Nginx reverse proxy
  # Public entry point
  # ----------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - textroute
      - mkdocs
    networks:
      - web
    restart: unless-stopped

  # ----------------------------
  # TextRoute FastAPI application
  # ----------------------------
  textroute:
    build:
      context: ./textroute-api
      dockerfile: Dockerfile
    command:
      [
        "uvicorn",
        "src.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "6060"
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      SMS_PROVIDER: ${SMS_PROVIDER:-logging}
      SMS_PROVIDER_URL: ${SMS_PROVIDER_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
      - internal
    restart: unless-stopped

  # ----------------------------
  # MkDocs documentation
  # Public through Nginx:
  # https://textroute-docs.1000texts.com
  # ----------------------------
  mkdocs:
    build:
      context: ./docs/mkdocs
    networks:
      - web
    restart: unless-stopped

  # ----------------------------
  # PostgreSQL + pgvector
  # ----------------------------
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  web:
  internal:
    internal: true
