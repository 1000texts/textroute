[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textroute-api"
version = "0.1.0"
description = "TextRoute FastAPI service — SMS group routing with human-in-the-loop moderation"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

# Pinned runtime deps live in requirements.txt (Docker + CI).
# Local: pip install -r requirements.txt && pip install -e ".[dev]"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
